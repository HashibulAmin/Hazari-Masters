    <script>
      // Gracefully suppress Vite dev client HMR WebSocket errors in AI Studio iframe environment
      window.addEventListener('error', function(event) {
        var msg = event && event.message ? String(event.message) : '';
        if (msg.includes('WebSocket') || msg.includes('@vite/client') || msg.includes('createWebSocketModuleRunnerTransport')) {
          event.preventDefault();
          event.stopPropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason ? String(event.reason) : '';
        if (reason.includes('WebSocket') || reason.includes('@vite/client') || reason.includes('createWebSocketModuleRunnerTransport')) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    </script>
