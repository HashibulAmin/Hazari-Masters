    <script>
      (function() {
        // AI Studio Environment: HMR is disabled by system policy.
        // Intercept Vite HMR client WebSocket connections to prevent connection attempt errors.
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isViteHmr = false;
            try {
              if (protocols === 'vite-hmr') isViteHmr = true;
              if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) isViteHmr = true;
              if (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('token=') !== -1 || url.indexOf('@vite') !== -1)) {
                if (protocols === 'vite-hmr') isViteHmr = true;
              }
            } catch (e) {}

            if (isViteHmr) {
              // Return dummy connected WebSocket for Vite HMR client to prevent error/rejection
              var listeners = {};
              return {
                url: url,
                readyState: 1, // WebSocket.OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                send: function() {},
                close: function() {},
                addEventListener: function(type, fn) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(fn);
                },
                removeEventListener: function(type, fn) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                },
                dispatchEvent: function() { return true; }
              };
            }

            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }

        // Suppress any remaining Vite HMR console error logs or window events
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.join(' ');
          if (
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            str.indexOf('WebSocket closed without opened') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1
          ) {
            return;
          }
          return origConsoleError.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || event.filename || (event.error && event.error.stack))) || '';
          msg = String(msg);
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('@vite/client') !== -1 ||
            msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            msg.indexOf('WebSocket closed without opened') !== -1
          ) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = (event && (event.reason && (event.reason.stack || event.reason.message || event.reason))) || '';
          reason = String(reason);
          if (
            reason.indexOf('WebSocket') !== -1 ||
            reason.indexOf('@vite/client') !== -1 ||
            reason.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            reason.indexOf('WebSocket closed without opened') !== -1
          ) {
            event.preventDefault();
            event.stopPropagation();
          }
        });
      })();
    </script>
